name: Avisos

# The notifications are sent by the Cloudflare Worker (worker.mjs, every 5 minutes). This workflow is only for trying
# things by hand: a test notification to someone (test_to) or a dry run.
on:
  workflow_dispatch:
    inputs:
      test_to:
        description: 'Mandar ahora un aviso de prueba a esta persona (por ejemplo Alex). Vacío: una ronda en seco que solo muestra lo que se enviaría'
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project: [mi-gente-quedadas, mi-gente-preprod]
    # one run at a time per project, so two never write the sent-list over each other
    concurrency:
      group: avisos-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node send.mjs
        env:
          PROJECT: ${{ matrix.project }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          # a name: only a test notification to that person; no name: a dry round (the Worker does the real ones)
          TEST_TO: ${{ inputs.test_to }}
          TEST_ONLY: ${{ inputs.test_to != '' && '1' || '0' }}
          DRY_RUN: ${{ inputs.test_to == '' && '1' || '0' }}

